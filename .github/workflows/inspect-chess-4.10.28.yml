name: Inspect Chess 4.10.28 structure

on:
  push:
    branches:
      - morphe-chess-assistant

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download APKPure XAPK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -A "Mozilla/5.0" \
            "https://data.winudf.com/XAPK/Y29tLmNoZXNzXzI4MDEyNV9jNDVkMWJlOA?_p=Y29tLmNoZXNz&filename=Chess+-+Play+and+Learn+Online_4.10.28-googleplay_APKPure.xapk&full_size=181608472&is_hot=true&k=020ae2b121f83ed231062a1bb3e296626aff7ada&package_name=com.chess&source=web&token=1794955226-ba50965e4a-0-694fcc3914035b795cfacc119853662d" \
            -o chess.xapk
          echo "d236513012230b88eae1de25c499b4803fee3bd46c6af47b367c4f8aa3176990  chess.xapk" | sha256sum -c -
          unzip -q chess.xapk -d xapk
          find xapk -maxdepth 2 -type f -name '*.apk' -printf '%p\n' | sort > apk-list.txt
          test -s apk-list.txt
          cat apk-list.txt

      - name: Install JADX
        run: |
          curl -fL --retry 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile the relevant classes only
        run: |
          set -euo pipefail
          mkdir -p decompiled report
          for cls in \
            com.chess.chessboard.v2.ChessBoardView \
            com.chess.realchess.ui.game.RealGameActivity \
            com.chess.realchess.ui.game.RealGameViewModel \
            com.chess.chessboard.variants.PositionExtKt \
            com.chess.chessboard.variants.standard.StandardPosition \
            com.chess.chessboard.variants.standard.bitboard.FenUtilsKt \
            com.chess.features.analysis.standalonev2.StandaloneAnalysisActivityV2 \
            com.chess.entities.RealGameUiSetup \
            com.chess.entities.ComputerAnalysisConfiguration \
            com.chess.entities.ResolvedGameConfiguration \
            chesscom.bots.v2.BotGameConfig \
            chesscom.bots.v2.BotGameContextExtension \
            chesscom.computer.v2.GameMode
          do
            echo "Decompiling $cls"
            ./jadx/bin/jadx --no-res --threads-count 2 --single-class "$cls" -d decompiled xapk/com.chess.apk \
              || echo "WARNING: JADX could not fully decompile $cls"
          done
          cp apk-list.txt report/
          cp decompiled/resources/AndroidManifest.xml report/AndroidManifest.xml 2>/dev/null || true
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path("decompiled/sources")
          report = pathlib.Path("report/classes-and-methods.txt")
          exact = [
              "com/chess/chessboard/v2/ChessBoardView.java",
              "com/chess/realchess/ui/game/RealGameActivity.java",
              "com/chess/realchess/ui/game/RealGameViewModel.java",
              "com/chess/chessboard/variants/PositionExtKt.java",
              "com/chess/chessboard/variants/standard/StandardPosition.java",
              "com/chess/chessboard/variants/standard/bitboard/FenUtilsKt.java",
              "com/chess/features/analysis/standalonev2/StandaloneAnalysisActivityV2.java",
              "com/chess/entities/RealGameUiSetup.java",
              "com/chess/entities/ComputerAnalysisConfiguration.java",
              "com/chess/entities/ResolvedGameConfiguration.java",
              "chesscom/bots/v2/BotGameConfig.java",
              "chesscom/bots/v2/BotGameContextExtension.java",
              "chesscom/computer/v2/GameMode.java",
          ]
          with report.open("w", encoding="utf-8") as out:
              for rel in exact:
                  p = root / rel
                  out.write("\n\n========== " + rel + " ==========\n")
                  if not p.exists():
                      out.write("NOT RECOVERED BY JADX\n")
                      continue
                  lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
                  for line in lines:
                      s = line.rstrip()
                      if (
                          " class " in s or s.lstrip().startswith(("public ", "protected ", "private "))
                          or any(token in s for token in [
                              "onCreate(", "onResume(", "onDraw(", "onLayout(",
                              "getPosition(", "getFen(", "getFEN(", "getBoard(",
                              "toFen(", "toFEN(", "fen(", "position(",
                              "findViewById", "setContentView"
                          ])
                      ):
                          out.write(s[:400] + "\n")
          print(report.read_text(encoding="utf-8")[:12000])
          PY
      - name: Upload structural report only
        uses: actions/upload-artifact@v4
        with:
          name: chess-4.10.28-structural-report
          path: report/
          if-no-files-found: error
